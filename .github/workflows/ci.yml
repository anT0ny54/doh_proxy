name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    name: Test, lint, build and integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Integration tests (real HTTP)
        run: npm run test:integration
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Docker image
        run: docker build -t doh-proxy:ci .

      # Runs the image on the host network against the local mock upstream
      # and performs a real DoH query, so a broken standalone bundle or a
      # missing socket-IP preload fails CI (not just "the home page loads").
      - name: Docker container smoke test
        run: node scripts/docker-smoke-test.mjs doh-proxy:ci

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # npm audit only needs the lockfile; no install required.
      # Blocking gate: production dependencies must be vulnerability-free.
      - name: Production dependency audit
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      # Advisory: the remaining findings are dev-only. The braces/micromatch/
      # fast-glob chain is lint-time only and its advisory has no patched
      # release (vulnerable range "*"), so this step reports but never blocks.
      - name: Full audit including devDependencies (advisory)
        run: npm audit --package-lock-only --audit-level=moderate
        continue-on-error: true
