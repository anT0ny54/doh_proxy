name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-build:
    name: Test, lint, build and integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests (real HTTP)
        run: npm run test:integration

      - name: Build Docker image
        run: docker build -t doh-proxy:ci .

      - name: Docker container smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --name doh-proxy -P doh-proxy:ci
          mapped="$(docker port doh-proxy | grep -m1 '/tcp' | sed 's/.*://')"
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${mapped}/" > /dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          docker logs doh-proxy
          docker rm -f doh-proxy
          if [ "$ready" != "1" ]; then
            echo "Container did not serve HTTP on its advertised port" >&2
            exit 1
          fi

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
