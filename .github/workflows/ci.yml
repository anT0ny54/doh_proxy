name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    name: Test, lint, build and integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Integration tests (real HTTP)
        run: npm run test:integration
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Docker image
        run: docker build -t doh-proxy:ci .

      - name: Docker container smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --name doh-proxy -P doh-proxy:ci

          # The Dockerfile EXPOSEs a single port (8367); ask Docker for the
          # host mapping instead of scraping free-form output.
          mapped=""
          for _ in $(seq 1 30); do
            mapped="$(docker port doh-proxy 8367/tcp 2>/dev/null | head -n1 | cut -d: -f2 || true)"
            [ -n "$mapped" ] && break
            sleep 1
          done
          if [ -z "$mapped" ]; then
            echo "Could not determine the container's published port" >&2
            docker logs doh-proxy || true
            docker rm -f doh-proxy || true
            exit 1
          fi
          echo "Container published on 127.0.0.1:${mapped}"

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${mapped}/" > /dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done

          docker logs doh-proxy
          docker rm -f doh-proxy

          if [ "$ready" != "1" ]; then
            echo "Container did not serve HTTP on its advertised port" >&2
            exit 1
          fi

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: production dependencies must be vulnerability-free.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Advisory: the remaining findings are dev-only. The braces/micromatch/
      # fast-glob chain is lint-time only and its advisory has no patched
      # release (vulnerable range "*"), so this step reports but never blocks.
      - name: Full audit including devDependencies (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true
