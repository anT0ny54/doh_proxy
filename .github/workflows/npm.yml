name: Update package-lock.json

on:
  workflow_dispatch:

concurrency:
  group: generate-package-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Regenerate, verify and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # A full regeneration (not --package-lock-only on top of the old file)
      # re-resolves every transitive dependency, including Next.js'
      # platform-specific @next/swc-* optional packages.
      - name: Regenerate package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f package-lock.json
          rm -rf node_modules
          npm install --ignore-scripts --no-audit --no-fund

      - name: Check platform binaries are locked
        shell: bash
        run: |
          set -Eeuo pipefail
          for pkg in @next/swc-linux-x64-gnu @next/swc-linux-x64-musl; do
            if ! grep -q "\"node_modules/${pkg}\"" package-lock.json; then
              echo "package-lock.json has no entry for ${pkg}" >&2
              exit 1
            fi
          done

      # Never commit a lockfile that breaks the project.
      - name: Verify with the new lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so CI
      # will not run on this commit by itself; run it manually or open a PR.
      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- package-lock.json

          if git diff --cached --quiet -- package-lock.json; then
            echo "No changes detected in package-lock.json."
            exit 0
          fi

          git commit -m "chore(deps): regenerate package-lock.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
