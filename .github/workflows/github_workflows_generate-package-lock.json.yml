name: Generate package-lock.json

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/github_workflows_generate-package-lock.yml

  workflow_dispatch:

  schedule:
    # Weekly, Sunday at 02:30 UTC
    - cron: "30 2 * * 0"

concurrency:
  group: generate-package-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package.json

      - name: Verify npm
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f package.json
          node --version
          npm --version

      - name: Generate package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Validate package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s package-lock.json
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- package-lock.json

          if git diff --cached --quiet -- package-lock.json; then
            echo "No changes detected in package-lock.json."
            exit 0
          fi

          git commit \
            -m "chore(deps): update package-lock.json [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          