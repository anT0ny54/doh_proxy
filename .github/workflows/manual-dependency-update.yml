name: Manual dependency update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Controls the runtime used by JavaScript-based GitHub Actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update dependencies
        run: |
          npm install --global npm-check-updates
          ncu -u
          npm install

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update npm dependencies"
          title: "chore: update npm dependencies"
          body: |
            This pull request was created by the manual dependency-update workflow.
          branch: chore/manual-dependency-update
          delete-branch: true
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          
